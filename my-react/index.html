<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-react</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
  </head>
  <body class="bg-dark bg-opacity-10">
        <header class="d-flex justify-content-between align-items-center p-3 bg-white border-bottom">
                <h2 class="ms-3">Task List</h2>
                <div class="me-3">
                        <button id="addTaskBtn" class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addTaskModal">+ Add Task</button>
                </div>
        </header>

        <main class="container py-4">
                <div id="tasksContainer" class="row g-3">
                        <!-- Tasks will be rendered here -->
                </div>
        </main>

        <!-- Add Task Modal -->
        <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Task</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addTaskForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Task</label>
                                <input id="taskName" name="taskName" type="text" class="form-control" placeholder="Type your task here..." required maxlength="100">
                                <div class="invalid-feedback">Task name is required and must be 100 characters or fewer.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Priority</label>
                                <div id="priorityOptions" class="d-flex gap-2">
                                    <button type="button" class="btn btn-outline-danger priority-btn" data-priority="High">High</button>
                                    <button type="button" class="btn btn-outline-warning priority-btn" data-priority="Medium">Medium</button>
                                    <button type="button" class="btn btn-outline-success priority-btn" data-priority="Low">Low</button>
                                </div>
                                <input id="priority" name="priority" type="hidden" value="Low">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select id="status" name="status" class="form-select">
                                    <option>To Do</option>
                                    <option>In Progress</option>
                                    <option>Done</option>
                                </select>
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary">Add</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="main.js"></script>
    </body>
  </body>
</html>
